name: Build & Publish Palm Player Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Assets
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk release-assets/PalmPlayer-Universal.apk
          cp androidApp/build/outputs/apk/debug/androidApp-arm64-v8a-debug.apk release-assets/PalmPlayer-arm64-v8a.apk
          cp androidApp/build/outputs/apk/debug/androidApp-x86_64-debug.apk release-assets/PalmPlayer-x86_64.apk
          cp androidApp/build/outputs/apk/debug/androidApp-armeabi-v7a-debug.apk release-assets/PalmPlayer-armeabi-v7a.apk

      - name: Generate Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Palm Player ${{ steps.tag.outputs.TAG_NAME }}"
          body: |
            ## 🌴 Palm Player ${{ steps.tag.outputs.TAG_NAME }}
            
            ### ✨ What's New & Highlights:
            - **🚀 Live In-App Updates**: Check and install new releases directly inside the app with a single tap.
            - **🔕 Quiet Launch**: Completely eliminated annoying update popups when opening the app.
            - **🎵 Play Next Queue Priority**: Single-track queue actions and swipes insert immediately after the currently playing song.
            - **✨ Frosted Glass Bottom Bar**: Translucent navigation bar with smooth backdrop blur.
            - **🚫 100% Ad-Free**: Clean, zero-ad music streaming with all tracking SDKs stripped.
            - **🎚️ High-Fidelity Audio**: Full parametric equalizer, AutoEQ presets, synchronized lyrics, and Spotify Canvas videos.
            - **👤 Built & Maintained by Rajdip Saha**.

            ### 📦 Download Assets:
            - **Universal (All Phones & Emulators)**: `PalmPlayer-Universal.apk`
            - **Modern Android (64-bit)**: `PalmPlayer-arm64-v8a.apk`
            - **PC Emulators / ChromeOS**: `PalmPlayer-x86_64.apk`
            - **Legacy Devices**: `PalmPlayer-armeabi-v7a.apk`
          files: |
            release-assets/PalmPlayer-Universal.apk
            release-assets/PalmPlayer-arm64-v8a.apk
            release-assets/PalmPlayer-x86_64.apk
            release-assets/PalmPlayer-armeabi-v7a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
